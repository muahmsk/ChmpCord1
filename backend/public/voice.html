<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>ChmpCord | Sesli Oda</title>
  <link rel="stylesheet" href="voice.css">
  <script src="/socket.io/socket.io.js"></script>
</head>
<body>

<div class="sidebar">
  <h2>ChmpCord</h2>
  <a href="/panel">🏠 Ana Panel</a>
  <a href="/voice" class="active">🔊 Sesli Oda</a>
  <a href="/logout" class="logout">Çıkış Yap</a>
</div>

<div class="content">
  <h2>Ses Kanalları</h2>
  <div id="channelList"></div>

  <h3>Odadakiler</h3>
  <div id="users"></div>

  <button id="leaveRoom" style="display:none;" class="leave-btn">Odayı Terk Et</button>

  <!-- LOCAL CAMERA -->
  <div id="videoArea">
      <div class="video-wrapper draggable" id="localWrap">
          <video id="localVideo" class="video-tile" autoplay muted playsinline></video>
          <button class="fullscreen-btn" data-target="localVideo">⛶</button>
      </div>

      <!-- EKRAN PAYLAŞIMI -->
      <div class="video-wrapper draggable" id="screenWrap">
          <video id="screenVideo" class="video-tile" autoplay playsinline></video>
          <button class="fullscreen-btn" data-target="screenVideo">⛶</button>
      </div>
  </div>

  <!-- ALT KONTROLLER -->
  <div class="controls">
      <button id="micBtn">🎤</button>
      <button id="camBtn">📷</button>
      <button id="screenBtn">🖥️</button>
      <button id="leaveCallBtn" class="end">📞</button>
  </div>

</div>

<script src="voice.js"></script>
</body>
</html>
