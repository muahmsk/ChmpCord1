<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <title>ChmpCord Panel</title>
  <style>
    body {
      margin: 0;
      background: #0d1117;
      font-family: Arial, sans-serif;
      color: #fff;
      display: flex;
    }

    /* SOL SİDEBAR */
    #sidebar {
      width: 250px;
      height: 100vh;
      background: #161b22;
      padding-top: 30px;
      box-sizing: border-box;
      border-right: 1px solid #30363d;
    }

    #sidebar h2 {
      text-align: center;
      margin-bottom: 30px;
    }

    .menu-item {
      padding: 15px 20px;
      border-bottom: 1px solid #30363d;
      cursor: pointer;
      transition: 0.2s;
    }

    .menu-item:hover {
      background: #21262d;
    }

    /* ANA İÇERİK */
    #content {
      flex: 1;
      padding: 30px;
    }

    /* Kullanıcı Kartı */
    #userCard {
      display: flex;
      align-items: center;
      gap: 15px;
      margin-bottom: 30px;
      background: #161b22;
      padding: 20px;
      border-radius: 10px;
      border: 1px solid #30363d;
    }

    #userCard img {
      width: 80px;
      height: 80px;
      border-radius: 50%;
    }

    #logout {
      margin-top: 20px;
      display: inline-block;
      padding: 10px 20px;
      background: #da3633;
      color: white;
      border-radius: 8px;
      text-decoration: none;
    }

    #logout:hover {
      background: #b32623;
    }
  </style>
</head>
<body>

  <!-- Sol Menü -->
  <div id="sidebar">
    <h2>ChmpCord</h2>

    <div class="menu-item" onclick="location.href='/panel'">🏠 Ana Panel</div>
    <div class="menu-item" onclick="location.href='/voice'">🔊 Sesli Oda</div>
    <div class="menu-item">⚙️ Ayarlar</div>

    <a id="logout" href="/logout">Çıkış Yap</a>
  </div>

  <!-- İçerik -->
  <div id="content">
    <div id="userCard">
      <img id="avatar" src="" alt="avatar" />
      <div>
        <h2 id="username">Yükleniyor...</h2>
        <p id="userid"></p>
      </div>
    </div>

    <h1>ChmpCord Paneline Hoş Geldin 🎉</h1>
    <p>Sol menüden ses kanalına girebilir veya ayarları düzenleyebilirsin.</p>
  </div>

  <script>
    async function loadUser() {
      const res = await fetch("/api/user");
      const user = await res.json();

      if (user.error) {
        location.href = "/login";
        return;
      }

      const avatarURL = user.avatar
        ? `https://cdn.discordapp.com/avatars/${user.id}/${user.avatar}.png`
        : "https://cdn.discordapp.com/embed/avatars/0.png";

      document.getElementById("avatar").src = avatarURL;
      document.getElementById("username").textContent = `${user.username}#${user.discriminator}`;
      document.getElementById("userid").textContent = `ID: ${user.id}`;
    }

    loadUser();
  </script>

</body>
</html>
